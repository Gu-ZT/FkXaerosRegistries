# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.9
loader_version=0.19.3
# Mod Properties
mod_version=1.0.0
maven_group=dev.dubhe.gugle
archives_base_name=fk-xaeros-registries
# Build Target
# Single source of truth for this release branch; the CI workflows read these too.
mod_loader=fabric
java_version=21
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.134.1+1.21.9
# Xaero artifacts: *_artifact is the Modrinth Maven version string (its naming is
# irregular across game versions), *_version is the bare mod version used for the
# minimum bound in fabric.mod.json.
xaero_minimap_artifact=25.2.15_Fabric_1.21.9
xaero_minimap_version=25.2.15
xaero_worldmap_artifact=1.39.17_Fabric_1.21.9
xaero_worldmap_version=1.39.17
