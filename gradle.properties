# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Minecraft Properties
minecraft_version=1.21.2
# Mod Properties
mod_version=1.0.0
maven_group=dev.dubhe.gugle
archives_base_name=fk-xaeros-registries
# Build Target
# Single source of truth for this release branch; the CI workflows read these too.
mod_loader=neoforge
java_version=21
# Dependencies
# check this on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.2.1-beta
# Xaero artifacts: *_artifact is the Modrinth Maven version string (its naming is
# irregular across game versions), *_version is the bare mod version used for the
# minimum bound in neoforge.mods.toml.
# Xaero publishes nothing for Minecraft 1.21.2: the artifacts are left blank so the
# build skips them, and the bounds are unconstrained.
xaero_minimap_artifact=
xaero_minimap_version=0.0.0
xaero_worldmap_artifact=
xaero_worldmap_version=0.0.0
