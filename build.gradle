plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

String buildType
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
String buildTypeEnv = System.getenv("BUILD_TYPE")
if (buildTypeEnv == "pr") {
    buildType = "pr"
} else if (buildTypeEnv == "snapshot") {
    buildType = "snapshot"
} else if (buildTypeEnv == "release") {
    buildType = null
    buildNumber = null
} else {
    buildType = "build"
}

// Every release branch publishes to the same Modrinth/CurseForge project, so the
// version has to carry the game version and loader to stay unique across branches.
def targetSuffix = "${project.minecraft_version}-${project.mod_loader}"

def githubRef = System.getenv("GITHUB_REF")
String baseVersion
if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    baseVersion = githubRef.substring(githubRef.lastIndexOf("/") + 1).replaceFirst(/^v/, "")
} else {
    baseVersion = "${project.mod_version}"
}
version = "${baseVersion}+${targetSuffix}" + (buildNumber != null ? "-${buildType}.${buildNumber}" : "")
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fk_xaeros_registries" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven { // Sodium, Embeddium, Iris, Jade
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Xaero has no build for every game version; the mixin targets its classes by
    // name, so the jars are only needed for the dev runtime and are skipped when absent.
    if (project.xaero_minimap_artifact) {
        modImplementation "maven.modrinth:xaeros-minimap:${project.xaero_minimap_artifact}"
    }
    if (project.xaero_worldmap_artifact) {
        modImplementation "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_artifact}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "xaero_minimap_version", project.xaero_minimap_version
    inputs.property "xaero_worldmap_version", project.xaero_worldmap_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "xaero_minimap_version": project.xaero_minimap_version,
                "xaero_worldmap_version": project.xaero_worldmap_version
    }
}

def targetJavaVersion = project.java_version as int
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
