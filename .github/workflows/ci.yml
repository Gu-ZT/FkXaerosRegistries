name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - releases/**
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradlew
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build target
        id: target
        shell: bash
        run: |
          prop() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          echo "minecraft=$(prop minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "loader=$(prop mod_loader)" >> "$GITHUB_OUTPUT"
          echo "java=$(prop java_version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ steps.target.outputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ steps.target.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --console=plain

      - name: Find mod artifacts
        id: artifact
        shell: bash
        run: |
          jar=$(find build/libs -maxdepth 1 -type f -name 'fk-xaeros-registries-*.jar' ! -name '*-sources.jar' -print -quit)
          sources=$(find build/libs -maxdepth 1 -type f -name 'fk-xaeros-registries-*-sources.jar' -print -quit)
          test -n "$jar"
          test -n "$sources"
          name=$(basename "$jar" .jar)
          version=${name#fk-xaeros-registries-}
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sources }}
          if-no-files-found: error

      - name: Publish beta to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Fk Xaero's Registries Beta v${{ steps.artifact.outputs.version }}
          version: ${{ steps.artifact.outputs.version }}
          version-type: beta
          changelog: Automated beta build from ${{ github.sha }}.
          game-versions: ${{ steps.target.outputs.minecraft }}
          loaders: ${{ steps.target.outputs.loader }}
          java: ${{ steps.target.outputs.java }}
          fail-mode: fail
          modrinth-id: JHFjxQyf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1661969
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sources }}
