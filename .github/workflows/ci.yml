name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradlew
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: fk-xaeros-registries
          path: build/libs/fk-xaeros-registries-*.jar
          if-no-files-found: error
