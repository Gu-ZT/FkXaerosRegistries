name: Pull Request Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradlew
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build target
        id: target
        shell: bash
        run: |
          prop() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          echo "minecraft=$(prop minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "loader=$(prop mod_loader)" >> "$GITHUB_OUTPUT"
          echo "java=$(prop java_version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ steps.target.outputs.java }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ steps.target.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: fk-xaeros-registries-pr-${{ steps.target.outputs.minecraft }}-${{ steps.target.outputs.loader }}
          path: build/libs/fk-xaeros-registries-*.jar
          if-no-files-found: error
